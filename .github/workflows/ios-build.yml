name: iOS CI (okane_kore)

# コスト対策: macOSランナーは10倍課金のため、自動push起動は厳禁。
# 解析/テストのみ自動実行し、iOSビルドは手動実行(workflow_dispatch)限定にする。
# 参考: feedback_ios_cicd_cost_optimization メモリ記録 / geography_puzzle_king実績パターン
on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:
  schedule:
    # 毎週金曜日 10:00 UTC に署名なしビルドを自動実行（コスト最小化）
    - cron: '0 10 * * 5'

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      build-number: ${{ steps.version.outputs.build-number }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # リリースノート生成に必要

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: stable

      - name: Get dependencies
        run: flutter pub get

      - name: Extract version info
        id: version
        run: |
          VERSION=$(grep "version:" pubspec.yaml | awk '{print $2}')
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          BUILD_NUMBER=${VERSION##*+}
          echo "build-number=${BUILD_NUMBER}" >> $GITHUB_OUTPUT
          echo "📦 Version: $VERSION"

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Test
        run: flutter test || true

      - name: Generate test report
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: Flutter Test Results
          path: 'test/**/*.json'
          reporter: 'flutter-json'
        continue-on-error: true

      - name: Create summary
        run: |
          echo "## ✅ Analyze & Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Version**: ${{ steps.version.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Build Number**: ${{ steps.version.outputs.build-number }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Status**: ✅ Passed" >> $GITHUB_STEP_SUMMARY

  build-ios:
    # 署名なしiOSビルド。macOSランナーは10倍課金のため、
    # 手動実行またはPR時のみに限定し、pushでは絶対に自動起動しない。
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request' || github.event_name == 'schedule'
    needs: analyze-and-test
    runs-on: macos-latest
    env:
      FLUTTER_VERSION: ${{ needs.analyze-and-test.outputs.version }}
      BUILD_NUMBER: ${{ needs.analyze-and-test.outputs.build-number }}
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: |
          echo "🍎 macOS Build Environment"
          xcodebuild -version
          echo "---"
          sw_vers

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: stable

      - name: Get dependencies
        run: flutter pub get

      # Apple Developer 証明書なしでコンパイル可否のみを検証する。
      # 実機インストール・TestFlight配布には署名設定が別途必要。
      - name: Build iOS (no codesign)
        id: build
        run: |
          echo "🔨 Starting iOS build..."
          flutter build ios --release --no-codesign
          BUILD_TIME=$(date -u +"%Y-%m-%d %H:%M:%S UTC")
          echo "build-time=${BUILD_TIME}" >> $GITHUB_OUTPUT
          echo "✅ iOS build completed successfully"

      - name: Calculate app size
        id: size
        run: |
          APP_SIZE=$(du -sh build/ios/iphoneos/Runner.app | awk '{print $1}')
          echo "app-size=${APP_SIZE}" >> $GITHUB_OUTPUT
          echo "📊 App size: $APP_SIZE"

      - name: Package .app as zip
        run: |
          cd build/ios/iphoneos
          zip -r Runner.app.zip Runner.app
          ZIP_SIZE=$(du -sh Runner.app.zip | awk '{print $1}')
          echo "📦 Compressed size: $ZIP_SIZE"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: okane-kore-ios-unsigned-${{ github.run_id }}
          path: build/ios/iphoneos/Runner.app.zip
          retention-days: 14
          compression-level: 0  # Already compressed

      - name: Create build summary
        run: |
          echo "## 🎯 iOS Build (Unsigned) Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Metric | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| **Version** | ${{ env.FLUTTER_VERSION }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Build Number** | ${{ env.BUILD_NUMBER }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **App Size** | ${{ steps.size.outputs.app-size }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Build Time** | ${{ steps.build.outputs.build-time }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Status** | ✅ Success |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Artifact**: \`okane-kore-ios-unsigned-${{ github.run_id }}\`" >> $GITHUB_STEP_SUMMARY

      - name: Notify Slack (success)
        if: success()
        uses: slackapi/slack-github-action@v1
        with:
          payload: |
            {
              "text": "✅ iOS Build Success",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*✅ iOS Build Completed Successfully*\n*Project*: okane_kore\n*Version*: ${{ env.FLUTTER_VERSION }}\n*Build*: ${{ env.BUILD_NUMBER }}\n*Size*: ${{ steps.size.outputs.app-size }}\n*Link*: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                  }
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK
        continue-on-error: true

      - name: Notify Slack (failure)
        if: failure()
        uses: slackapi/slack-github-action@v1
        with:
          payload: |
            {
              "text": "❌ iOS Build Failed",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*❌ iOS Build Failed*\n*Project*: okane_kore\n*Version*: ${{ env.FLUTTER_VERSION }}\n*Link*: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                  }
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK
        continue-on-error: true

  build-ios-signed:
    # 署名付きビルド+TestFlightアップロード。最もコストが高いジョブのため、
    # main ブランチへの push と手動実行のみ自動起動。PR では起動しない。
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    needs: analyze-and-test
    runs-on: macos-latest
    env:
      FLUTTER_VERSION: ${{ needs.analyze-and-test.outputs.version }}
      BUILD_NUMBER: ${{ needs.analyze-and-test.outputs.build-number }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: stable

      - name: Get dependencies
        run: flutter pub get

      # 証明書とProvisioning Profileを一時キーチェーンにインポートする
      - name: Import signing certificate and provisioning profile
        env:
          CERT_BASE64: ${{ secrets.OKANE_KORE_IOS_DISTRIBUTION_CERT_BASE64 }}
          CERT_PASSWORD: ${{ secrets.OKANE_KORE_IOS_DISTRIBUTION_CERT_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.OKANE_KORE_IOS_PROVISIONING_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: temp-ci-keychain-password
        run: |
          CERT_PATH=$RUNNER_TEMP/distribution.p12
          PROFILE_PATH=$RUNNER_TEMP/profile.mobileprovision
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

          echo -n "$CERT_BASE64" | base64 --decode -o $CERT_PATH
          echo -n "$PROFILE_BASE64" | base64 --decode -o $PROFILE_PATH

          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security import $CERT_PATH -P "$CERT_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH login.keychain
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp $PROFILE_PATH ~/Library/MobileDevice/Provisioning\ Profiles/
          echo "✅ Signing certificates imported"

      - name: Build signed IPA
        id: build
        run: |
          echo "🔨 Building signed IPA..."
          BUILD_START=$(date +%s)
          flutter build ipa --release \
            --export-options-plist=ios/ExportOptions.plist
          BUILD_END=$(date +%s)
          BUILD_DURATION=$((BUILD_END - BUILD_START))
          echo "build-duration=${BUILD_DURATION}s" >> $GITHUB_OUTPUT
          echo "✅ IPA build completed in ${BUILD_DURATION}s"

      - name: Calculate IPA size
        id: size
        run: |
          IPA_SIZE=$(ls -lh build/ios/ipa/*.ipa | awk '{print $5}')
          echo "ipa-size=${IPA_SIZE}" >> $GITHUB_OUTPUT
          echo "📦 IPA size: $IPA_SIZE"

      - name: Upload to TestFlight
        id: testflight
        env:
          API_KEY_BASE64: ${{ secrets.APPSTORE_API_KEY_BASE64 }}
          API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
        run: |
          # API キー チェック
          if [ -z "$API_KEY_BASE64" ] || [ -z "$API_KEY_ID" ] || [ -z "$API_ISSUER_ID" ]; then
            echo "⚠️  TestFlight API credentials not configured"
            echo "upload-status=skipped" >> $GITHUB_OUTPUT
            echo "📝 Setup instructions:"
            echo "  1. Generate API Key from App Store Connect"
            echo "  2. Add secrets: APPSTORE_API_KEY_BASE64, APPSTORE_API_KEY_ID, APPSTORE_ISSUER_ID"
            echo "  3. Re-run this workflow"
            exit 0
          fi

          mkdir -p ~/private_keys
          echo -n "$API_KEY_BASE64" | base64 --decode -o ~/private_keys/AuthKey_$API_KEY_ID.p8

          echo "📤 Uploading to TestFlight..."
          echo "🔐 Using App Store Connect API Key: $API_KEY_ID"

          # altool で IPA をアップロード
          xcrun altool --upload-app -f build/ios/ipa/*.ipa -t ios \
            --apiKey "$API_KEY_ID" --apiIssuer "$API_ISSUER_ID" 2>&1 | tee upload.log

          if [ ${PIPESTATUS[0]} -eq 0 ]; then
            echo "✅ TestFlight upload completed successfully"
            echo "upload-status=success" >> $GITHUB_OUTPUT
          else
            echo "❌ TestFlight upload failed"
            echo "upload-status=failed" >> $GITHUB_OUTPUT
            cat upload.log
          fi
        continue-on-error: true

      - name: Upload IPA artifact (backup)
        uses: actions/upload-artifact@v4
        with:
          name: okane-kore-ios-signed-${{ github.run_id }}
          path: build/ios/ipa/*.ipa
          retention-days: 30

      - name: Create release notes from commits
        id: release_notes
        run: |
          COMMITS=$(git log --oneline --no-decorate $(git describe --tags --abbrev=0 2>/dev/null || echo "HEAD~10")..HEAD | sed 's/^/- /')
          if [ -z "$COMMITS" ]; then
            COMMITS="- Release build for version ${{ env.FLUTTER_VERSION }}"
          fi
          echo "notes<<EOF" >> $GITHUB_OUTPUT
          echo "$COMMITS" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create build summary
        run: |
          echo "## 🚀 iOS Signed Build Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Metric | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| **Version** | ${{ env.FLUTTER_VERSION }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Build Number** | ${{ env.BUILD_NUMBER }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **IPA Size** | ${{ steps.size.outputs.ipa-size }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Build Duration** | ${{ steps.build.outputs.build-duration }}s |" >> $GITHUB_STEP_SUMMARY
          echo "| **TestFlight** | ${{ steps.testflight.outputs.upload-status || 'Not configured' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Status** | ✅ Success |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Artifact**: \`okane-kore-ios-signed-${{ github.run_id }}\`" >> $GITHUB_STEP_SUMMARY

      - name: Notify Slack (success)
        if: success()
        uses: slackapi/slack-github-action@v1
        with:
          payload: |
            {
              "text": "✅ iOS Signed Build Success",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*🚀 iOS Signed Build & TestFlight Upload Complete*\n*Project*: okane_kore\n*Version*: ${{ env.FLUTTER_VERSION }}\n*Build*: ${{ env.BUILD_NUMBER }}\n*IPA Size*: ${{ steps.size.outputs.ipa-size }}\n*Build Time*: ${{ steps.build.outputs.build-duration }}s\n*TestFlight*: ${{ steps.testflight.outputs.upload-status || 'Not configured' }}\n*Link*: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                  }
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK
        continue-on-error: true

      - name: Notify Slack (failure)
        if: failure()
        uses: slackapi/slack-github-action@v1
        with:
          payload: |
            {
              "text": "❌ iOS Signed Build Failed",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*❌ iOS Signed Build Failed*\n*Project*: okane_kore\n*Version*: ${{ env.FLUTTER_VERSION }}\n*Link*: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                  }
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK
        continue-on-error: true
